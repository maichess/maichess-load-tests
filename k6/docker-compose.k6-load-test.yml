services:
  k6:
    image: grafana/k6:latest
    command: >
      run
      --out experimental-prometheus-rw
      --tag testid=${K6_TESTID:-load-test}
      /load-tests/k6/${K6_TEST_FILE:-tests/auth.test.js}
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: ${PROMETHEUS_RW_URL}
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_VUS: ${K6_VUS:-}
      K6_DURATION: ${K6_DURATION:-}
      AUTH_URL: ${AUTH_URL:-https://auth.staging.maichess.berger-software.com}
      USER_URL: ${USER_URL:-https://users.staging.maichess.berger-software.com}
      MATCHMAKER_URL: ${MATCHMAKER_URL:-https://matchmaker.staging.maichess.berger-software.com}
      MATCHMANAGER_URL: ${MATCHMANAGER_URL:-https://matchmanager.staging.maichess.berger-software.com}
      ANALYSIS_URL: ${ANALYSIS_URL:-https://analysis.staging.maichess.berger-software.com}
    volumes:
      - ../:/load-tests:ro
    restart: "no"
